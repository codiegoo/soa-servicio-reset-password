<!doctype html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Recuperar contraseña
  </title>

</head>


<body
  class="
    min-h-screen
    bg-slate-950
    flex
    items-center
    justify-center
    px-6
  "
>


  <!-- Fondo decorativo -->

  <div
    class="
      fixed
      inset-0
      overflow-hidden
      pointer-events-none
    "
  >

    <div
      class="
        absolute
        -top-40
        -right-40
        w-96
        h-96
        rounded-full
        bg-blue-600/20
        blur-3xl
      "
    ></div>


    <div
      class="
        absolute
        -bottom-40
        -left-40
        w-96
        h-96
        rounded-full
        bg-indigo-600/20
        blur-3xl
      "
    ></div>

  </div>


  <!-- Contenedor -->

  <main
    class="
      relative
      w-full
      max-w-md
    "
  >


    <!-- Card -->

    <section
      class="
        rounded-3xl
        border
        border-white/10
        bg-white/[0.07]
        backdrop-blur-xl
        shadow-2xl
        p-8
        sm:p-10
      "
    >


      <!-- Icono -->

      <div
        class="
          mx-auto
          mb-6
          flex
          h-16
          w-16
          items-center
          justify-center
          rounded-2xl
          bg-blue-600/15
          ring-1
          ring-blue-500/30
        "
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          class="
            h-8
            w-8
            text-blue-400
          "
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 0h10.5A1.75 1.75 0 0 1 19 12.25v7A1.75 1.75 0 0 1 17.25 21h-10.5A1.75 1.75 0 0 1 5 19.25v-7a1.75 1.75 0 0 1 1.75-1.75Z"
          />

        </svg>

      </div>


      <!-- Título -->

      <div
        class="
          text-center
          mb-8
        "
      >

        <h1
          class="
            text-3xl
            font-bold
            tracking-tight
            text-white
          "
        >
          ¿Olvidaste tu contraseña?
        </h1>


        <p
          class="
            mt-3
            text-sm
            leading-6
            text-slate-400
          "
        >
          Ingresa el correo electrónico asociado
          a tu cuenta y te enviaremos un enlace
          para restablecer tu contraseña.
        </p>

      </div>


      <!-- Formulario -->

      <form
        id="forgot-password-form"
        class="space-y-5"
      >


        <!-- Email -->

        <div>

          <label
            for="email"
            class="
              mb-2
              block
              text-sm
              font-medium
              text-slate-200
            "
          >
            Correo electrónico
          </label>


          <div
            class="
              relative
            "
          >

            <div
              class="
                pointer-events-none
                absolute
                inset-y-0
                left-0
                flex
                items-center
                pl-4
              "
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                class="
                  h-5
                  w-5
                  text-slate-500
                "
              >

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0-8.69 5.527a2 2 0 0 1-2.12 0L2.25 6.75"
                />

              </svg>

            </div>


            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="correo@ejemplo.com"
              required
              class="
                w-full
                rounded-xl
                border
                border-white/10
                bg-slate-900/70
                py-3.5
                pl-12
                pr-4
                text-sm
                text-white
                placeholder:text-slate-600
                outline-none
                transition
                focus:border-blue-500
                focus:ring-4
                focus:ring-blue-500/10
              "
            />

          </div>

        </div>


        <!-- Mensaje -->

        <div
          id="message"
          class="
            hidden
            rounded-xl
            px-4
            py-3
            text-sm
          "
          role="alert"
        ></div>


        <!-- Botón -->

        <button
          id="submit-button"
          type="submit"
          class="
            w-full
            rounded-xl
            bg-blue-600
            px-5
            py-3.5
            text-sm
            font-semibold
            text-white
            shadow-lg
            shadow-blue-600/20
            transition
            duration-200
            hover:bg-blue-500
            hover:shadow-blue-500/30
            focus:outline-none
            focus:ring-4
            focus:ring-blue-500/20
            disabled:cursor-not-allowed
            disabled:opacity-50
          "
        >
          Enviar instrucciones
        </button>


      </form>


      <!-- Regresar -->

      <div
        class="
          mt-7
          text-center
        "
      >

        <a
          href="#"
          class="
            text-sm
            font-medium
            text-slate-400
            transition
            hover:text-blue-400
          "
        >
          ← Regresar al inicio de sesión
        </a>

      </div>


    </section>


    <!-- Footer -->

    <p
      class="
        mt-6
        text-center
        text-xs
        text-slate-600
      "
    >
      © 2026 Servicio SOA. Todos los derechos reservados.
    </p>


  </main>


  <script
    type="module"
    src="/src/main.ts"
  ></script>

</body>

</html>
